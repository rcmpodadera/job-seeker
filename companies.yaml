# Each entry needs:
#   name: display name (anything you want)
#   ats:  which scraper handles it — one of: greenhouse, lever, ashby, cabify
#   slug: the identifier in the ATS URL (NOT needed for custom sites like cabify)
#
# To find a slug: open the company's careers page, and look at the jobs API URL
# in DevTools. e.g. boards-api.greenhouse.io/v1/boards/STRIPE/jobs  ->  slug: stripe

